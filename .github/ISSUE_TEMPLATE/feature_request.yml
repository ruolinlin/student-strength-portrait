name: Feature request
description: 提议新的产品、研究或工程改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述用户情境，不要只描述功能形式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 解释、隐私或公平性影响
      description: 这项变化会如何影响学生、观察者或数据处理？
