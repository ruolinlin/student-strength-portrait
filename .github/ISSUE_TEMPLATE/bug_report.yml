name: Bug report
description: 报告可以稳定复现的产品或技术问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿上传真实学生姓名、逐题回答、邀请链接或其他可识别信息。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？你原本期待什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开…\n2. 点击…\n3. 看到…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: 浏览器、系统、提交版本
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可以提供不含个人数据的截图或控制台信息。
